<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сьогодні дивимось — yarosfactory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120e0a;
    --bg-glow: radial-gradient(1200px 600px at 50% -10%, rgba(176,141,87,0.10), transparent 60%);
    --panel:#1b1610;
    --panel-2:#211a12;
    --border:#3a2f20;
    --border-soft: rgba(176,141,87,0.25);
    --gold:#b08d57;
    --gold-bright:#e0bb7d;
    --teal:#537468;
    --text:#e9e0cd;
    --text-dim:#a89b83;
    --text-mute:#75695a;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background: var(--bg-glow), var(--bg);
    color:var(--text);
    font-family:'Golos Text', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:56px 20px 90px;
  }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom:44px; }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--text-mute);
    margin-bottom:16px;
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  .eyebrow::before, .eyebrow::after{
    content:""; height:1px; width:48px;
    background:linear-gradient(90deg, transparent, var(--border-soft));
  }
  .eyebrow::after{ background:linear-gradient(90deg, var(--border-soft), transparent); }

  h1{
    font-family:'Yeseva One', serif;
    font-weight:400;
    font-size:clamp(28px, 4.5vw, 44px);
    letter-spacing:0.02em;
    margin:0 0 10px;
    color:var(--gold-bright);
    text-shadow:0 0 40px rgba(224,187,125,0.18);
  }
  .sub{ color:var(--text-dim); font-size:14.5px; max-width:480px; margin:0 auto; line-height:1.6; }

  .pagenav{ margin-top:22px; }
  .pagenav a{
    color:var(--text-mute); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    text-decoration:none; border-bottom:1px solid var(--border); padding-bottom:2px;
    transition:color .15s, border-color .15s;
  }
  .pagenav a:hover{ color:var(--gold-bright); border-color:var(--gold); }

  /* ---------- Hero focus panel ---------- */
  .hero{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:32px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--border);
    padding:28px;
    position:relative;
    min-height:330px;
  }
  .hero::before, .hero::after{
    content:""; position:absolute; width:18px; height:18px; opacity:0.8;
  }
  .hero::before{ top:8px; left:8px; border-top:1px solid var(--gold); border-left:1px solid var(--gold); }
  .hero::after{ bottom:8px; right:8px; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); }

  .hero-poster{
    position:relative;
    aspect-ratio:2/3;
    width:100%;
    border:1px solid var(--border-soft);
    background:var(--panel-2) center/cover no-repeat;
    overflow:hidden;
    box-shadow:0 0 50px rgba(176,141,87,0.10);
  }
  .hero-poster img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero-poster .no-poster{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:16px; font-family:'Yeseva One', serif; font-size:18px; color:var(--text-mute);
    background:radial-gradient(120% 120% at 20% 0%, rgba(176,141,87,0.10), transparent 60%), var(--panel-2);
  }

  .hero-body{ min-width:0; }
  .status-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    padding:6px 12px; border:1px solid var(--border-soft); color:var(--gold-bright);
    margin-bottom:16px;
  }
  .status-tag.watched{ color:var(--teal); border-color:rgba(83,116,104,0.4); }
  .status-tag.planned{ color:var(--text-mute); border-color:var(--border); }
  .status-tag .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .hero-body h2{
    font-family:'Yeseva One', serif; font-weight:400;
    font-size:clamp(22px, 3vw, 32px); color:var(--text); margin:0 0 10px; line-height:1.25;
  }
  .hero-meta{ font-size:13px; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:16px; }
  .hero-meta .genre{ color:var(--teal); }

  .bar{ display:flex; gap:3px; margin-bottom:16px; max-width:180px; }
  .bar span{ height:5px; flex:1; background:var(--panel-2); border:1px solid var(--border); }
  .bar span.filled{ background:var(--gold); border-color:var(--gold-bright); }

  .hero-note{ font-size:14px; color:var(--text-dim); line-height:1.6; max-width:520px; }
  .hero-empty{ color:var(--text-mute); font-size:15px; line-height:1.7; }

  /* ---------- Timeline ---------- */
  .timeline-wrap{ margin-top:36px; position:relative; }
  .timeline-label{
    display:flex; justify-content:space-between; font-size:10.5px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--text-mute); margin-bottom:10px; padding:0 4px;
  }
  .timeline-label .today-lbl{ color:var(--gold-bright); }

  .timeline-shell{ position:relative; display:flex; align-items:center; gap:8px; }

  .arrow{
    flex:0 0 auto; width:36px; height:36px; border:1px solid var(--border);
    background:var(--panel); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    transition:border-color .15s, color .15s;
  }
  .arrow:hover{ border-color:var(--gold); color:var(--gold-bright); }

  .timeline-viewport{
    flex:1; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    display:flex; align-items:center;
    scrollbar-width:none;
    position:relative;
    padding:14px 0;
  }
  .timeline-viewport::-webkit-scrollbar{ display:none; }
  .timeline-viewport::before{
    content:"";
    position:absolute; left:0; right:0; top:50%;
    height:1px; background:linear-gradient(90deg, transparent, var(--border-soft) 15%, var(--border-soft) 85%, transparent);
    z-index:0;
  }

  .node{
    flex:0 0 auto;
    scroll-snap-align:center;
    width:64px;
    padding:0 10px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer;
    position:relative; z-index:1;
    transition:transform .15s ease, opacity .15s ease;
  }
  .node-ring{
    width:56px; height:56px; border-radius:50%;
    border:2px solid var(--border);
    background:var(--panel-2) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
    transition:border-color .2s, box-shadow .2s;
  }
  .node-ring img{ width:100%; height:100%; object-fit:cover; }
  .node-ring .mono{ font-family:'Yeseva One', serif; font-size:15px; color:var(--text-mute); }

  .node.watched .node-ring{ border-color:var(--gold); }
  .node.planned .node-ring{ border-style:dashed; border-color:var(--text-mute); opacity:0.55; }
  .node.today .node-ring{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 4px rgba(224,187,125,0.14), 0 0 22px rgba(224,187,125,0.35);
  }
  .node .flame{ position:absolute; bottom:-3px; right:-3px; font-size:13px; }
  .node-date{ font-size:9px; color:var(--text-mute); white-space:nowrap; }
  .node.current .node-date{ color:var(--gold-bright); }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-mute); font-size:14px;
    border:1px dashed var(--border); margin-top:20px;
  }

  footer{ text-align:center; margin-top:70px; color:var(--text-mute); font-size:12px; letter-spacing:0.05em; }

  @media (max-width:640px){
    .hero{ grid-template-columns:1fr; }
    .hero-poster{ max-width:220px; margin:0 auto; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">yarosfactory · ярос</div>
    <h1>Сьогодні дивимось</h1>
    <p class="sub">Що дивимось сьогодні, що вже переглянули, і що ще попереду. Гортай стрічку вліво чи вправо.</p>
    <nav class="pagenav"><a href="archive.html">Весь архів переглянутого →</a></nav>
  </header>

  <div id="heroSection"></div>

  <div class="timeline-wrap">
    <div class="timeline-label"><span>← переглянуті</span><span class="today-lbl">сьогодні</span><span>заплановані →</span></div>
    <div class="timeline-shell">
      <button class="arrow" id="prevBtn" aria-label="Назад">‹</button>
      <div class="timeline-viewport" id="timeline"></div>
      <button class="arrow" id="nextBtn" aria-label="Вперед">›</button>
    </div>
  </div>

  <footer>оновлюється вручну · movies.json</footer>
</div>

<script>
let ALL_MOVIES = [];
let currentIndex = 0;

const heroSection = document.getElementById('heroSection');
const timelineEl = document.getElementById('timeline');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function fmtDateLong(d){
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('uk-UA', { day:'numeric', month:'long', year:'numeric' });
}
function fmtDateShort(d){
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('uk-UA', { day:'numeric', month:'short' });
}

function todayStr(){
  const t = new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}

function statusOf(m){
  if(m.watched === todayStr()) return 'today';
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(m.watched) < today ? 'watched' : 'planned';
}

function ratingBar(rating){
  let out = '<div class="bar">';
  for(let i=1;i<=5;i++){ out += `<span class="${i<=rating ? 'filled':''}"></span>`; }
  out += '</div>';
  return out;
}

function renderHero(m){
  if(!m){
    heroSection.innerHTML = `<div class="empty-state">Ще немає жодного фільму. Додай записи в movies.json.</div>`;
    return;
  }
  const status = statusOf(m);
  const posterInner = m.poster
    ? `<img src="${escapeHtml(m.poster)}" alt="${escapeHtml(m.title)}" onerror="this.parentElement.innerHTML='<div class=&quot;no-poster&quot;>${escapeHtml(m.title)}</div>'">`
    : `<div class="no-poster">${escapeHtml(m.title)}</div>`;

  let tagHtml, extraHtml;
  if(status === 'today'){
    tagHtml = `<div class="status-tag today"><span class="dot"></span>Сьогодні</div>`;
    extraHtml = m.rating ? ratingBar(m.rating) : '';
  } else if(status === 'watched'){
    tagHtml = `<div class="status-tag watched"><span class="dot"></span>Переглянуто ${fmtDateLong(m.watched)}</div>`;
    extraHtml = ratingBar(m.rating || 0);
  } else {
    tagHtml = `<div class="status-tag planned"><span class="dot"></span>Заплановано на ${fmtDateLong(m.watched)}</div>`;
    extraHtml = '';
  }

  heroSection.innerHTML = `
    <div class="hero">
      <div class="hero-poster">${posterInner}</div>
      <div class="hero-body">
        ${tagHtml}
        <h2>${escapeHtml(m.title)}</h2>
        <div class="hero-meta">${m.year || ''}${m.year ? ' · ' : ''}<span class="genre">${escapeHtml(m.genre || '')}</span></div>
        ${extraHtml}
        ${m.note ? `<p class="hero-note">${escapeHtml(m.note)}</p>` : ''}
      </div>
    </div>
  `;
}

function renderTimeline(){
  timelineEl.innerHTML = ALL_MOVIES.map((m, i) => {
    const status = statusOf(m);
    const inner = m.poster
      ? `<img src="${escapeHtml(m.poster)}" alt="" onerror="this.parentElement.innerHTML='<span class=&quot;mono&quot;>${escapeHtml((m.title||'?').charAt(0))}</span>'">`
      : `<span class="mono">${escapeHtml((m.title||'?').charAt(0))}</span>`;
    const flame = status === 'today' ? '<span class="flame">🔥</span>' : '';
    return `
      <div class="node ${status} ${i===currentIndex ? 'current':''}" data-index="${i}" title="${escapeHtml(m.title)}">
        <div class="node-ring">${inner}${flame}</div>
        <div class="node-date">${fmtDateShort(m.watched)}</div>
      </div>
    `;
  }).join('');

  timelineEl.querySelectorAll('.node').forEach(node => {
    node.addEventListener('click', () => {
      focusIndex(parseInt(node.dataset.index, 10), true);
    });
  });
}

function focusIndex(i, smooth){
  if(i < 0 || i >= ALL_MOVIES.length) return;
  currentIndex = i;
  renderHero(ALL_MOVIES[currentIndex]);
  timelineEl.querySelectorAll('.node').forEach(n => n.classList.toggle('current', parseInt(n.dataset.index,10) === currentIndex));

  const node = timelineEl.querySelector(`.node[data-index="${i}"]`);
  if(node){
    node.scrollIntoView({ behavior: smooth ? 'smooth' : 'instant', inline: 'center', block: 'nearest' });
  }
}

prevBtn.addEventListener('click', () => focusIndex(currentIndex - 1, true));
nextBtn.addEventListener('click', () => focusIndex(currentIndex + 1, true));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') focusIndex(currentIndex - 1, true);
  if(e.key === 'ArrowRight') focusIndex(currentIndex + 1, true);
});

fetch('movies.json')
  .then(res => {
    if(!res.ok) throw new Error('Не вдалося завантажити movies.json');
    return res.json();
  })
  .then(data => {
    ALL_MOVIES = Array.isArray(data)
      ? data.slice().sort((a,b) => new Date(a.watched) - new Date(b.watched))
      : [];

    if(ALL_MOVIES.length === 0){
      renderHero(null);
      return;
    }

    let startIndex = ALL_MOVIES.findIndex(m => m.watched === todayStr());
    if(startIndex === -1){
      const today = new Date(); today.setHours(0,0,0,0);
      let best = 0, bestDiff = Infinity;
      ALL_MOVIES.forEach((m, i) => {
        const diff = Math.abs(new Date(m.watched) - today);
        if(diff < bestDiff){ bestDiff = diff; best = i; }
      });
      startIndex = best;
    }

    renderTimeline();
    focusIndex(startIndex, false);
  })
  .catch(err => {
    heroSection.innerHTML = `<div class="empty-state">Не вдалося завантажити список. Перевір, що файл <strong>movies.json</strong> лежить поруч з index.html.<br><br><span style="opacity:.6">${escapeHtml(err.message)}</span></div>`;
  });
</script>

</body>
</html>
