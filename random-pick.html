<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо випадковості — yarosfactory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="common.css">
<style>
  .wrap{ max-width:560px; padding:56px 20px 90px; text-align:center; }
  header{ margin-bottom:20px; }
  h1{ font-size:clamp(28px, 4.5vw, 40px); margin-bottom:10px; }
  .sub{ margin:0 auto; }

  .reel-wrap{ position:relative; max-width:480px; margin:36px auto 10px; }

  .reel-window{
    height:calc(var(--row-h) * 5);
    overflow:hidden; position:relative;
    background:var(--panel); border:3px solid var(--gold);
    box-shadow:0 0 34px rgba(224,187,125,0.18);
  }
  :root{ --row-h: 76px; }

  .reel-track{ will-change:transform; }

  .reel-row{
    height:var(--row-h); display:flex; align-items:center; gap:14px;
    padding:0 18px; box-sizing:border-box;
    border-bottom:1px solid var(--border);
  }
  .reel-row .thumb{
    width:44px; height:60px; flex:0 0 auto; object-fit:cover;
    background:var(--panel-2); border:1px solid var(--border);
  }
  .reel-row .no-thumb{
    width:44px; height:60px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--border); font-size:9px; color:var(--text-mute); text-align:center; padding:2px;
  }
  .reel-row .title{
    font-size:16px; color:var(--text); text-align:left;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .reel-center-band{
    position:absolute; left:0; right:0; top:50%; height:var(--row-h);
    transform:translateY(-50%);
    border-top:2px solid var(--gold-bright); border-bottom:2px solid var(--gold-bright);
    background:rgba(224,187,125,0.08);
    pointer-events:none; z-index:2;
  }
  .reel-arrow-left, .reel-arrow-right{
    position:absolute; top:50%; transform:translateY(-50%); font-size:20px; color:var(--gold-bright); z-index:3;
  }
  .reel-arrow-left{ left:-4px; }
  .reel-arrow-right{ right:-4px; }

  .reel-fade-top, .reel-fade-bottom{
    position:absolute; left:0; right:0; height:60px; z-index:1; pointer-events:none;
  }
  .reel-fade-top{ top:0; background:linear-gradient(180deg, var(--panel), transparent); }
  .reel-fade-bottom{ bottom:0; background:linear-gradient(0deg, var(--panel), transparent); }

  .wheel-spin-btn{
    display:inline-block; margin:20px auto 0; background:var(--gold); border:1px solid var(--gold); color:#1b1610;
    padding:13px 36px; font-size:14px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    cursor:pointer; transition:background .15s;
  }
  .wheel-spin-btn:hover{ background:var(--gold-bright); }
  .wheel-spin-btn:disabled{ opacity:0.5; cursor:default; }
  .wheel-result{
    text-align:center; margin-top:18px; font-family:'Spectral', serif; font-weight:600; font-size:19px;
    color:var(--gold-bright); min-height:26px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">yarosfactory · ярос</div>
    <h1>Колесо випадковості</h1>
    <p class="sub">Не можеш обрати, що замовити? Хай вирішить барабан.</p>
    <nav class="pagenav">
      <a href="wishlist.html">← Побажання</a>
    </nav>
    <div id="authWidget"></div>
  </header>

  <div id="wheelSection">
    <div class="reel-wrap">
      <div class="reel-arrow-left">▶</div>
      <div class="reel-arrow-right">◀</div>
      <div class="reel-window">
        <div class="reel-center-band"></div>
        <div class="reel-fade-top"></div>
        <div class="reel-fade-bottom"></div>
        <div class="reel-track" id="reelTrack"></div>
      </div>
    </div>
    <button type="button" class="wheel-spin-btn" id="spinBtn">Крутити!</button>
    <div class="wheel-result" id="wheelResult"></div>
  </div>
  <div class="empty-mini" id="emptyMsg" style="display:none;">Ще замало схвалених побажань, щоб крутити (потрібно хоча б два).</div>

  <footer>оновлюється вручну · movies.json</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
const wheelSection = document.getElementById('wheelSection');
const emptyMsg = document.getElementById('emptyMsg');
const reelTrack = document.getElementById('reelTrack');
const spinBtn = document.getElementById('spinBtn');
const wheelResult = document.getElementById('wheelResult');

const ROW_H = 76;
const VISIBLE_ROWS = 5;
const CENTER_ROW = Math.floor(VISIBLE_ROWS / 2); // 2
const COPIES = 12; // скільки разів повторити список у стрічці для довгого прокручування

let items = [];
let isSpinning = false;

function rowHtml(it){
  const thumb = it.poster
    ? `<img class="thumb" src="${escapeHtml(it.poster)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;no-thumb&quot;>${escapeHtml((it.title||'').slice(0,10))}</div>'">`
    : `<div class="no-thumb">${escapeHtml((it.title || '').slice(0, 10))}</div>`;
  return `<div class="reel-row">${thumb}<div class="title">${escapeHtml(it.title || '')}</div></div>`;
}

function buildTrack(){
  let rows = '';
  for(let c = 0; c < COPIES; c++){
    rows += items.map(rowHtml).join('');
  }
  reelTrack.innerHTML = rows;
  reelTrack.style.transition = 'none';
  reelTrack.style.transform = `translateY(${CENTER_ROW * ROW_H}px)`;
}

function updateItems(newItems){
  if(isSpinning) return;
  items = newItems;
  if(items.length < 2){
    wheelSection.style.display = 'none';
    emptyMsg.style.display = '';
    return;
  }
  wheelSection.style.display = '';
  emptyMsg.style.display = 'none';
  wheelResult.textContent = '';
  buildTrack();
}

spinBtn.addEventListener('click', () => {
  if(isSpinning || items.length < 2) return;
  isSpinning = true;
  spinBtn.disabled = true;
  wheelResult.textContent = '';

  // починаємо кожне кручення заново з нейтральної позиції (непомітно, бо відразу ж рушаємо анімацію)
  buildTrack();
  void reelTrack.offsetHeight; // форсуємо застосування скидання перед новою анімацією

  const n = items.length;
  const targetIdx = Math.floor(Math.random() * n);
  // приземляємось у копії ближче до кінця стрічки, щоб було довге прокручування
  const landingCopy = COPIES - 2;
  const absoluteRow = landingCopy * n + targetIdx;
  const finalY = (CENTER_ROW - absoluteRow) * ROW_H;

  reelTrack.style.transition = 'transform 4.2s cubic-bezier(.11,.7,.14,1)';
  reelTrack.style.transform = `translateY(${finalY}px)`;

  reelTrack.addEventListener('transitionend', function handler(){
    reelTrack.removeEventListener('transitionend', handler);
    const winner = items[targetIdx];
    wheelResult.textContent = `🎬 ${winner.title || ''}`;
    isSpinning = false;
    spinBtn.disabled = false;
  }, { once: true });
});

function loadSuggestions(){
  if(!firebaseReady){
    emptyMsg.textContent = 'Список тимчасово недоступний.';
    emptyMsg.style.display = '';
    wheelSection.style.display = 'none';
    return;
  }
  db.collection('suggestions').where('status', '==', 'approved')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snap => {
      const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      updateItems(list);
    }, err => {
      emptyMsg.textContent = 'Помилка завантаження: ' + err.message;
      emptyMsg.style.display = '';
      wheelSection.style.display = 'none';
    });
}

initAuth(document.getElementById('authWidget'));
loadSuggestions();
</script>

</body>
</html>
