<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архів переглянутого — yarosfactory</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .wrap{ max-width:980px; padding:64px 24px 96px; }
  header{ margin-bottom:56px; }
  h1{ font-size:clamp(32px, 5vw, 52px); margin-bottom:14px; }
  .sub{ font-size:15px; max-width:520px; }

  /* ---------- Stat runes ---------- */
  .runes{ display:flex; justify-content:center; gap:14px; margin-top:36px; flex-wrap:wrap; }
  .rune{ border:1px solid var(--border); background:var(--panel); padding:14px 26px; text-align:center; position:relative; min-width:120px; }
  .rune::before{ content:""; position:absolute; inset:4px; border:1px solid rgba(176,141,87,0.15); pointer-events:none; }
  .rune .num{ font-family:'Spectral', serif; font-size:26px; color:var(--gold-bright); display:block; }
  .rune .lbl{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-mute); margin-top:4px; display:block; }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    margin:52px 0 28px; padding-bottom:20px; border-bottom:1px solid var(--border);
  }
  .search{ flex:1; min-width:200px; }
  .search input{
    width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; font-family:'Golos Text', sans-serif; font-size:14px; outline:none; transition:border-color .2s;
  }
  .search input::placeholder{ color:var(--text-mute); }
  .search input:focus{ border-color:var(--gold); }

  .sort-select{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; font-family:'Golos Text', sans-serif; font-size:13px; outline:none;
    cursor:pointer; transition:border-color .2s;
  }
  .sort-select:focus, .sort-select:hover{ border-color:var(--gold); }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    font-family:'Golos Text', sans-serif; font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    padding:8px 14px; cursor:pointer; transition:all .15s;
  }
  .chip:hover{ border-color:var(--gold); color:var(--text); }
  .chip.active{ background:var(--gold); border-color:var(--gold); color:#1b1610; font-weight:600; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">yarosfactory · ярос</div>
    <h1>Архів переглянутого</h1>
    <p class="sub">Повний список фільмів та серіалів, які ми переглянули разом у стрімах. Тицяй на постер — відкриється сторінка фільму.</p>

    <div class="runes" id="stats"></div>
    <nav class="pagenav"><a href="calendar.html">← Календар</a><a href="index.html">До сьогоднішнього фільму →</a></nav>
    <div id="authWidget"></div>
  </header>

  <div class="controls">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Пошук за назвою…">
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="date-desc">За датою перегляду (спочатку нові)</option>
      <option value="date-asc">За датою перегляду (спочатку давніші)</option>
      <option value="rating-desc">За оцінкою (від найвищої)</option>
      <option value="rating-asc">За оцінкою (від найнижчої)</option>
      <option value="year-desc">За роком (від нових)</option>
      <option value="year-asc">За роком (від старих)</option>
    </select>
    <div class="chips" id="genreChips"></div>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Завантаження…</div>
  </div>

  <footer>оновлюється вручну · movies.json</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
let ALL_MOVIES = [];
let activeGenre = 'Усі';
let sortMode = 'date-desc';
let RATINGS_MAP = {};

const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const chipsEl = document.getElementById('genreChips');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');

function ratingOf(m){
  const r = RATINGS_MAP[movieId(m)];
  return r ? r.avg : 0;
}

async function loadRatingsMap(movies){
  if(!firebaseReady) return {};
  const entries = await Promise.all(movies.map(async m => {
    try{
      const snap = await db.collection('reactions').doc(movieId(m)).get();
      const data = snap.exists ? snap.data() : {};
      const count = data.ratingCount || 0;
      const sum = data.ratingSum || 0;
      return [movieId(m), { avg: count > 0 ? sum / count : 0, sum, count }];
    }catch(e){
      return [movieId(m), { avg: 0, sum: 0, count: 0 }];
    }
  }));
  return Object.fromEntries(entries);
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = ALL_MOVIES.filter(m => {
    const matchesGenre = activeGenre === 'Усі' || genresOf(m).includes(activeGenre);
    const matchesQuery = !q || (m.title || '').toLowerCase().includes(q);
    return matchesGenre && matchesQuery;
  });

  if(sortMode === 'rating-desc'){
    filtered.sort((a, b) => ratingOf(b) - ratingOf(a));
  } else if(sortMode === 'rating-asc'){
    filtered.sort((a, b) => ratingOf(a) - ratingOf(b));
  } else if(sortMode === 'year-desc'){
    filtered.sort((a, b) => (b.year || 0) - (a.year || 0));
  } else if(sortMode === 'year-asc'){
    filtered.sort((a, b) => (a.year || 0) - (b.year || 0));
  } else if(sortMode === 'date-asc'){
    filtered.sort((a, b) => new Date(a.watched) - new Date(b.watched));
  } else {
    filtered.sort((a, b) => new Date(b.watched) - new Date(a.watched));
  }

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Нічого не знайдено. Спробуй інший фільтр.</div>';
    return;
  }

  grid.innerHTML = filtered.map((m, i) => {
    const posterInner = m.poster
      ? `<img src="${escapeHtml(m.poster)}" alt="${escapeHtml(m.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;no-poster&quot;>${escapeHtml(m.title)}</div>'">`
      : `<div class="no-poster">${escapeHtml(m.title)}</div>`;
    const genreLabel = genresOf(m).join(' · ');
    const hostRating = m.rating ? (Number.isInteger(m.rating) ? m.rating : m.rating.toFixed(1)) : '';

    return `
    <div class="card" style="animation-delay:${Math.min(i*35, 350)}ms" data-id="${escapeHtml(movieId(m))}">
      <div class="poster">
        ${posterInner}
        <div class="corner-tr"></div><div class="corner-br"></div>
        <div class="badge-rating" ${hostRating ? '' : 'style="display:none"'}><svg viewBox="0 0 20 20"><path d="M10 1l2.6 6h6.4l-5.2 4 2 6.4L10 13.8 4.2 17.4l2-6.4L1 7h6.4z"/></svg><span class="val">${hostRating}</span></div>
        ${genreLabel ? `<div class="badge-genre">${escapeHtml(genreLabel)}</div>` : ''}
        <div class="poster-overlay">
          <div class="date">переглянуто ${fmtDateLong(m.watched)}</div>
        </div>
      </div>
      <h2>${escapeHtml(m.title)}</h2>
      <div class="meta">${m.year || ''}</div>
    </div>
  `;
  }).join('');

  grid.querySelectorAll('.card[data-id]').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = 'movie.html?id=' + encodeURIComponent(card.dataset.id);
    });
  });

  attachViewerRatings();
}

let ratingUnsubs = [];
function attachViewerRatings(){
  ratingUnsubs.forEach(unsub => unsub());
  ratingUnsubs = [];
  if(!firebaseReady) return;

  grid.querySelectorAll('.card[data-id]').forEach(card => {
    const id = card.dataset.id;
    const badge = card.querySelector('.badge-rating');
    const valEl = badge.querySelector('.val');
    const unsub = db.collection('reactions').doc(id).onSnapshot(snap => {
      const data = snap.exists ? snap.data() : {};
      const count = data.ratingCount || 0;
      if(count > 0){
        const avg = (data.ratingSum / count).toFixed(1);
        valEl.textContent = avg;
        badge.style.display = '';
      }
    }, err => console.warn('Помилка Firestore (rating badge):', err.message));
    ratingUnsubs.push(unsub);
  });
}

function buildStats(){
  const total = ALL_MOVIES.length;
  let sumTotal = 0, countTotal = 0;
  ALL_MOVIES.forEach(m => {
    const r = RATINGS_MAP[movieId(m)];
    if(r && r.count > 0){ sumTotal += r.sum; countTotal += r.count; }
  });
  const avg = countTotal > 0 ? (sumTotal / countTotal).toFixed(1) : '—';
  const now = new Date();
  const thisMonth = ALL_MOVIES.filter(m=>{
    const d = new Date(m.watched);
    return !isNaN(d) && d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).length;

  statsEl.innerHTML = `
    <div class="rune"><span class="num">${total}</span><span class="lbl">Всього</span></div>
    <div class="rune"><span class="num">${thisMonth}</span><span class="lbl">Цього місяця</span></div>
    <div class="rune"><span class="num">${avg}</span><span class="lbl">Сер. оцінка глядачів</span></div>
  `;
}

function buildChips(){
  const genres = ['Усі', ...new Set(ALL_MOVIES.flatMap(m => genresOf(m)))];
  chipsEl.innerHTML = genres.map(g =>
    `<button class="chip ${g===activeGenre?'active':''}" data-genre="${escapeHtml(g)}">${escapeHtml(g)}</button>`
  ).join('');

  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeGenre = btn.dataset.genre;
      chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

searchInput.addEventListener('input', render);
initAuth(document.getElementById('authWidget'));
sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  render();
});

fetch('movies.json')
  .then(res => {
    if(!res.ok) throw new Error('Не вдалося завантажити movies.json');
    return res.json();
  })
  .then(data => {
    const today = new Date(); today.setHours(0,0,0,0);
    ALL_MOVIES = Array.isArray(data)
      ? data.filter(m => new Date(m.watched) <= today).slice().sort((a,b)=> new Date(b.watched) - new Date(a.watched))
      : [];

    const urlGenre = new URLSearchParams(window.location.search).get('genre');
    if(urlGenre && ALL_MOVIES.some(m => genresOf(m).includes(urlGenre))){
      activeGenre = urlGenre;
    }

    buildStats();
    buildChips();
    render();

    loadRatingsMap(ALL_MOVIES).then(map => {
      RATINGS_MAP = map;
      buildStats();
      if(sortMode === 'rating-desc' || sortMode === 'rating-asc') render();
    });
  })
  .catch(err => {
    grid.innerHTML = `<div class="empty">Не вдалося завантажити список. Перевір, що файл <strong>movies.json</strong> лежить поруч з index.html.<br><br><span style="opacity:.6">${escapeHtml(err.message)}</span></div>`;
  });
</script>

</body>
</html>
