<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сьогодні дивимось — yarosfactory</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  :root{
    --tier2-w: clamp(70px, 9vw, 116px);
    --tier1-w: clamp(100px, 13vw, 168px);
    --tier0-w: clamp(140px, 18vw, 228px);
    --slot-h: calc(var(--tier0-w) * 1.5);
  }

  /* ---------- Carousel (fixed 5-slot stage) ---------- */
  .carousel-shell{ position:relative; display:flex; align-items:center; gap:8px; }

  .arrow{
    flex:0 0 auto; width:34px; height:34px; border:1px solid var(--border);
    background:rgba(27,22,16,0.7); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    transition:border-color .15s, color .15s;
  }
  .arrow:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .arrow:disabled{ opacity:0.3; cursor:default; pointer-events:none; }

  .stage{ flex:1; overflow:hidden; touch-action:pan-y; user-select:none; }

  .track{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:clamp(10px, 2vw, 18px);
    padding:16px 0 8px;
    will-change:transform;
  }

  .node{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
    animation:fadein .22s ease;
  }
  .node.empty, .node.today-empty{ cursor:default; }
  .node.empty{ visibility:hidden; pointer-events:none; }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }

  .node.tier-0{ width:var(--tier0-w); }
  .node.tier-1{ width:var(--tier1-w); }
  .node.tier-2{ width:var(--tier2-w); }

  .poster-slot{
    height:var(--slot-h);
    width:100%;
    display:flex; align-items:center; justify-content:center;
  }

  .poster-card{
    width:100%; aspect-ratio:2/3;
    border:1px solid var(--border);
    background:var(--panel-2) center/cover no-repeat;
    position:relative; overflow:hidden;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .poster-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; user-drag:none; user-select:none; pointer-events:none; }
  .poster-card .mono{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:10px; font-family:'Spectral', serif; font-size:13px; color:var(--text-mute);
    background:radial-gradient(120% 120% at 20% 0%, rgba(176,141,87,0.10), transparent 60%), var(--panel-2);
  }

  .node.watched .poster-card{ border-color:var(--gold); }
  .node.planned .poster-card{ border-color:var(--text-mute); }
  .node.today .poster-card{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 4px rgba(224,187,125,0.14), 0 0 24px rgba(224,187,125,0.35);
  }
  .node.today-empty .poster-card{
    border-style:dashed; border-color:var(--text-mute);
    display:flex; align-items:center; justify-content:center;
  }
  .node.today-empty .poster-card .q{ font-family:'Spectral', serif; font-size:26px; color:var(--text-mute); }
  .node .flame{ position:absolute; bottom:-2px; right:-2px; font-size:12px; z-index:2; }

  .node-title{
    font-size:11px; color:var(--text-dim); text-align:center; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .node-date{ font-size:9.5px; color:var(--text-mute); }

  .node.tier-0 .node-title{ color:var(--text); font-weight:600; font-size:17px; }
  .node.tier-0 .node-date{ font-size:12px; color:var(--text-dim); }
  .node.tier-1 .poster-card{ opacity:0.85; }
  .node.tier-2 .poster-card{ opacity:0.55; }
  .node.tier-2 .node-title, .node.tier-2 .node-date{ display:none; }

  .today-banner{
    max-width:520px; margin:26px auto 0; text-align:center;
    background:var(--panel); border:1px solid var(--border); padding:20px 24px;
  }
  .today-banner p{ font-size:13.5px; color:var(--text-dim); margin:0 0 4px; }
  .today-banner p strong{ color:var(--gold-bright); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">yarosfactory · ярос</div>
    <h1>Сьогодні дивимось</h1>
    <p class="sub">Гортай стрічку свайпом чи стрілками, тицяй на картку — відкриється сторінка фільму.</p>
    <nav class="pagenav"><a href="archive.html">← Архів переглянутого</a><a href="calendar.html">Календар →</a></nav>
    <div id="authWidget"></div>
  </header>

  <div class="carousel-shell">
    <button class="arrow" id="prevBtn" aria-label="Назад">‹</button>
    <div class="stage" id="stage">
      <div class="track" id="track"></div>
    </div>
    <button class="arrow" id="nextBtn" aria-label="Вперед">›</button>
  </div>

  <div id="bannerSection"></div>

  <footer>оновлюється вручну · movies.json</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
let MERGED = [];
let currentIndex = 0;

const stage = document.getElementById('stage');
const track = document.getElementById('track');
const bannerSection = document.getElementById('bannerSection');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderBanner(m){
  if(!m) { bannerSection.innerHTML = ''; return; }

  const status = statusOf(m);
  if(status === 'today-empty'){
    bannerSection.innerHTML = `
      <div class="today-banner">
        <p>На жаль, сьогодні нічого не заплановано.</p>
        <a class="twitch-link" href="https://www.twitch.tv/yarosfactory" target="_blank" rel="noopener">Замовити на стрімі →</a>
      </div>
    `;
  } else if(status === 'today'){
    bannerSection.innerHTML = `
      <div class="today-banner">
        <p>Сьогодні дивимось${m.orderedBy ? `. Замовлення: <strong>${escapeHtml(m.orderedBy)}</strong>` : ''}</p>
        <a class="twitch-link" href="https://www.twitch.tv/yarosfactory" target="_blank" rel="noopener">Перейти на стрім →</a>
      </div>
    `;
  } else {
    bannerSection.innerHTML = '';
  }
}

function nodeHtml(idx, offset){
  const tier = Math.abs(offset) === 0 ? 'tier-0' : Math.abs(offset) === 1 ? 'tier-1' : 'tier-2';
  if(idx < 0 || idx >= MERGED.length){
    return `<div class="node empty ${tier}"></div>`;
  }
  const m = MERGED[idx];
  const status = statusOf(m);
  let inner;
  if(m.__placeholder){
    inner = `<img src="no-order.jpg" alt="" draggable="false" onerror="this.parentElement.innerHTML='<span class=&quot;q&quot;>?</span>'">`;
  } else {
    inner = m.poster
      ? `<img src="${escapeHtml(m.poster)}" alt="" draggable="false" onerror="this.parentElement.innerHTML='<span class=&quot;mono&quot;>${escapeHtml(m.title||'')}</span>'">`
      : `<span class="mono">${escapeHtml(m.title||'')}</span>`;
  }
  const flame = status === 'today' ? '<span class="flame">🔥</span>' : '';
  const showBadge = !m.__placeholder && Math.abs(offset) <= 1;
  const hostRating = m.rating ? (Number.isInteger(m.rating) ? m.rating : m.rating.toFixed(1)) : '';
  const ratingBadge = showBadge
    ? `<div class="badge-rating" ${hostRating ? '' : 'style="display:none"'}><svg viewBox="0 0 20 20"><path d="M10 1l2.6 6h6.4l-5.2 4 2 6.4L10 13.8 4.2 17.4l2-6.4L1 7h6.4z"/></svg><span class="val">${hostRating}</span></div>`
    : '';
  const title = m.__placeholder ? 'Сьогодні' : (m.title || '');
  return `
    <div class="node ${status} ${tier}" data-index="${idx}" data-offset="${offset}">
      <div class="poster-slot"><div class="poster-card">${inner}${flame}${ratingBadge}</div></div>
      <div class="node-title">${escapeHtml(title)}</div>
      <div class="node-date">${fmtDateShort(m.watched)}</div>
    </div>
  `;
}

const BUFFER = 6;

function renderWindow(){
  const offsets = [];
  for(let i = -BUFFER; i <= BUFFER; i++) offsets.push(i);
  track.innerHTML = offsets.map(off => nodeHtml(currentIndex + off, off)).join('');

  track.querySelectorAll('.node[data-index]').forEach(node => {
    const idx = parseInt(node.dataset.index, 10);
    const m = MERGED[idx];
    if(m.__placeholder) return;
    node.addEventListener('click', () => {
      if(dragMoved) return;
      window.location.href = 'movie.html?id=' + encodeURIComponent(movieId(m));
    });
  });

  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= MERGED.length - 1;

  attachViewerRatings();
}

let ratingUnsubs = [];
function attachViewerRatings(){
  ratingUnsubs.forEach(unsub => unsub());
  ratingUnsubs = [];
  if(!firebaseReady) return;

  track.querySelectorAll('.node[data-index] .badge-rating').forEach(badge => {
    const node = badge.closest('.node');
    const idx = parseInt(node.dataset.index, 10);
    const m = MERGED[idx];
    if(!m || m.__placeholder) return;
    const id = movieId(m);
    const valEl = badge.querySelector('.val');
    const unsub = db.collection('reactions').doc(id).onSnapshot(snap => {
      const data = snap.exists ? snap.data() : {};
      const count = data.ratingCount || 0;
      if(count > 0){
        valEl.textContent = (data.ratingSum / count).toFixed(1);
        badge.style.display = '';
      }
    }, err => console.warn('Помилка Firestore (rating badge):', err.message));
    ratingUnsubs.push(unsub);
  });
}

function setCurrent(i){
  if(i < 0 || i >= MERGED.length || i === currentIndex) return;
  currentIndex = i;
  renderWindow();
  renderBanner(MERGED[currentIndex]);
}

let isAnimating = false;

function slideOutAndSwap(direction){
  isAnimating = true;
  const flyDistance = direction * -(stage.clientWidth * 0.55);
  track.style.transition = 'transform .26s cubic-bezier(.22,.61,.36,1)';
  requestAnimationFrame(() => {
    track.style.transform = `translateX(${flyDistance}px)`;
  });
  track.addEventListener('transitionend', function handler(){
    track.removeEventListener('transitionend', handler);
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    setCurrent(currentIndex + direction);
    isAnimating = false;
  }, { once: true });
}

function canMove(direction){
  return (direction === 1 && currentIndex < MERGED.length - 1) ||
         (direction === -1 && currentIndex > 0);
}

function snapBack(){
  track.style.transition = 'transform .24s cubic-bezier(.22,.61,.36,1)';
  track.style.transform = 'translateX(0px)';
  track.addEventListener('transitionend', function handler(){
    track.removeEventListener('transitionend', handler);
    track.style.transition = 'none';
  }, { once: true });
}

prevBtn.addEventListener('click', () => { if(!isAnimating && canMove(-1)) slideOutAndSwap(-1); });
nextBtn.addEventListener('click', () => { if(!isAnimating && canMove(1)) slideOutAndSwap(1); });

document.addEventListener('keydown', (e) => {
  if(isAnimating) return;
  if(e.key === 'ArrowLeft' && canMove(-1)) slideOutAndSwap(-1);
  if(e.key === 'ArrowRight' && canMove(1)) slideOutAndSwap(1);
});

/* swipe / drag support — carousel follows the pointer live, like spinning a physical wheel */
let dragStartX = null;
let dragCurrentDX = 0;
let dragMoved = false;

stage.addEventListener('pointerdown', (e) => {
  if(isAnimating) return;
  dragStartX = e.clientX;
  dragCurrentDX = 0;
  dragMoved = false;
  track.style.transition = 'none';
});
stage.addEventListener('pointermove', (e) => {
  if(dragStartX === null) return;
  dragCurrentDX = e.clientX - dragStartX;
  if(Math.abs(dragCurrentDX) > 10) dragMoved = true;
  track.style.transform = `translateX(${dragCurrentDX}px)`;
});
stage.addEventListener('pointerup', () => {
  if(dragStartX === null) return;
  const dx = dragCurrentDX;
  dragStartX = null;

  const threshold = 40;
  if(Math.abs(dx) > threshold){
    const direction = dx < 0 ? 1 : -1;
    if(canMove(direction)){
      isAnimating = true;
      const flyDistance = direction * -(stage.clientWidth * 0.55);
      track.style.transition = 'transform .24s cubic-bezier(.22,.61,.36,1)';
      track.style.transform = `translateX(${flyDistance}px)`;
      track.addEventListener('transitionend', function handler(){
        track.removeEventListener('transitionend', handler);
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        setCurrent(currentIndex + direction);
        isAnimating = false;
      }, { once: true });
    } else {
      snapBack();
    }
  } else {
    snapBack();
  }

  setTimeout(() => { dragMoved = false; }, 0);
});
stage.addEventListener('pointercancel', () => {
  dragStartX = null;
  snapBack();
});

initAuth(document.getElementById('authWidget'));

fetch('movies.json')
  .then(res => {
    if(!res.ok) throw new Error('Не вдалося завантажити movies.json');
    return res.json();
  })
  .then(data => {
    const list = Array.isArray(data) ? data.slice() : [];
    const t = todayStr();
    const hasToday = list.some(m => m.watched === t);
    if(!hasToday){
      list.push({ __placeholder: true, watched: t });
    }
    MERGED = list.sort((a, b) => new Date(a.watched) - new Date(b.watched));

    if(MERGED.length === 0){
      bannerSection.innerHTML = `<div class="empty-state">Ще немає жодного фільму. Додай записи в movies.json.</div>`;
      return;
    }

    let startIndex = MERGED.findIndex(m => m.__placeholder || m.watched === t);
    if(startIndex === -1) startIndex = 0;
    currentIndex = startIndex;

    renderWindow();
    renderBanner(MERGED[currentIndex]);
  })
  .catch(err => {
    bannerSection.innerHTML = `<div class="empty-state">Не вдалося завантажити список. Перевір, що файл <strong>movies.json</strong> лежить поруч з index.html.<br><br><span style="opacity:.6">${escapeHtml(err.message)}</span></div>`;
  });
</script>

</body>
</html>
