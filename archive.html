<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архів переглянутого — yarosfactory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .wrap{ max-width:980px; padding:64px 24px 96px; }
  header{ margin-bottom:56px; }
  h1{ font-size:clamp(32px, 5vw, 52px); margin-bottom:14px; }
  .sub{ font-size:15px; max-width:520px; }

  /* ---------- Stat runes ---------- */
  .runes{ display:flex; justify-content:center; gap:14px; margin-top:36px; flex-wrap:wrap; }
  .rune{ border:1px solid var(--border); background:var(--panel); padding:14px 26px; text-align:center; position:relative; min-width:120px; }
  .rune::before{ content:""; position:absolute; inset:4px; border:1px solid rgba(176,141,87,0.15); pointer-events:none; }
  .rune .num{ font-family:'Yeseva One', serif; font-size:26px; color:var(--gold-bright); display:block; }
  .rune .lbl{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-mute); margin-top:4px; display:block; }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    margin:52px 0 28px; padding-bottom:20px; border-bottom:1px solid var(--border);
  }
  .search{ flex:1; min-width:200px; }
  .search input{
    width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; font-family:'Golos Text', sans-serif; font-size:14px; outline:none; transition:border-color .2s;
  }
  .search input::placeholder{ color:var(--text-mute); }
  .search input:focus{ border-color:var(--gold); }

  .sort-select{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; font-family:'Golos Text', sans-serif; font-size:13px; outline:none;
    cursor:pointer; transition:border-color .2s;
  }
  .sort-select:focus, .sort-select:hover{ border-color:var(--gold); }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    font-family:'Golos Text', sans-serif; font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    padding:8px 14px; cursor:pointer; transition:all .15s;
  }
  .chip:hover{ border-color:var(--gold); color:var(--text); }
  .chip.active{ background:var(--gold); border-color:var(--gold); color:#1b1610; font-weight:600; }

  /* ---------- Grid (poster tiles) ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:20px 16px; }

  .card{
    position:relative; opacity:0; transform:translateY(14px);
    animation:reveal .5s ease forwards; cursor:pointer;
  }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }

  .poster{
    position:relative; aspect-ratio:2/3; width:100%;
    border:1px solid var(--border); background:var(--panel) center/cover no-repeat;
    overflow:hidden; transition:border-color .2s, box-shadow .2s;
  }
  .card:hover .poster{ border-color:var(--gold); box-shadow:0 0 28px rgba(176,141,87,0.16); }
  .poster img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .35s ease; }
  .card:hover .poster img{ transform:scale(1.05); }

  .poster .no-poster{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:14px; font-family:'Yeseva One', serif; font-size:16px; color:var(--text-mute);
    background:radial-gradient(120% 120% at 20% 0%, rgba(176,141,87,0.10), transparent 60%), var(--panel-2);
  }

  .poster .corner-tr, .poster .corner-br{ content:""; position:absolute; width:12px; height:12px; opacity:0.8; z-index:2; }
  .poster .corner-tr{ top:6px; right:6px; border-top:1px solid var(--gold-bright); border-right:1px solid var(--gold-bright); }
  .poster .corner-br{ bottom:6px; left:6px; border-bottom:1px solid var(--gold-bright); border-left:1px solid var(--gold-bright); }

  .badge-genre{
    position:absolute; top:8px; right:8px; z-index:2; background:rgba(18,14,10,0.82); border:1px solid var(--border);
    color:var(--teal); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; padding:4px 7px;
  }

  .poster-overlay{
    position:absolute; left:0; right:0; bottom:0; padding:26px 10px 10px;
    background:linear-gradient(180deg, transparent, rgba(10,7,5,0.94) 70%); z-index:1;
  }
  .poster-overlay .date{ font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-mute); }

  .card h2{ font-family:'Yeseva One', serif; font-weight:400; font-size:14.5px; color:var(--text); margin:8px 0 0; line-height:1.3; }
  .card .meta{ font-size:11px; color:var(--text-mute); margin-top:3px; }

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-mute); font-size:14px;
    border:1px dashed var(--border); grid-column:1/-1;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">yarosfactory · ярос</div>
    <h1>Архів переглянутого</h1>
    <p class="sub">Повний список фільмів та серіалів, які ми переглянули разом у стрімах. Тицяй на постер — відкриється сторінка фільму.</p>

    <div class="runes" id="stats"></div>
    <nav class="pagenav"><a href="index.html">← До сьогоднішнього фільму</a></nav>
  </header>

  <div class="controls">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Пошук за назвою…">
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="date">Спочатку нові</option>
      <option value="rating">За оцінкою</option>
    </select>
    <div class="chips" id="genreChips"></div>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Завантаження…</div>
  </div>

  <footer>оновлюється вручну · movies.json</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
let ALL_MOVIES = [];
let activeGenre = 'Усі';
let sortMode = 'date';

const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const chipsEl = document.getElementById('genreChips');
const searchInput = document.getElementById('searchInput');
const sortSelect = document.getElementById('sortSelect');

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = ALL_MOVIES.filter(m => {
    const matchesGenre = activeGenre === 'Усі' || genresOf(m).includes(activeGenre);
    const matchesQuery = !q || (m.title || '').toLowerCase().includes(q);
    return matchesGenre && matchesQuery;
  });

  if(sortMode === 'rating'){
    filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  } else {
    filtered.sort((a, b) => new Date(b.watched) - new Date(a.watched));
  }

  if(filtered.length === 0){
    grid.innerHTML = '<div class="empty">Нічого не знайдено. Спробуй інший фільтр.</div>';
    return;
  }

  grid.innerHTML = filtered.map((m, i) => {
    const posterInner = m.poster
      ? `<img src="${escapeHtml(m.poster)}" alt="${escapeHtml(m.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;no-poster&quot;>${escapeHtml(m.title)}</div>'">`
      : `<div class="no-poster">${escapeHtml(m.title)}</div>`;
    const genreLabel = genresOf(m).join(' · ');

    return `
    <div class="card" style="animation-delay:${Math.min(i*35, 350)}ms" data-id="${escapeHtml(movieId(m))}">
      <div class="poster">
        ${posterInner}
        <div class="corner-tr"></div><div class="corner-br"></div>
        ${m.rating ? `<div class="badge-rating"><svg viewBox="0 0 20 20"><path d="M10 1l2.6 6h6.4l-5.2 4 2 6.4L10 13.8 4.2 17.4l2-6.4L1 7h6.4z"/></svg>${Number.isInteger(m.rating) ? m.rating : m.rating.toFixed(1)}</div>` : ''}
        ${genreLabel ? `<div class="badge-genre">${escapeHtml(genreLabel)}</div>` : ''}
        <div class="poster-overlay">
          <div class="date">переглянуто ${fmtDateLong(m.watched)}</div>
        </div>
      </div>
      <h2>${escapeHtml(m.title)}</h2>
      <div class="meta">${m.year || ''}</div>
    </div>
  `;
  }).join('');

  grid.querySelectorAll('.card[data-id]').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = 'movie.html?id=' + encodeURIComponent(card.dataset.id);
    });
  });
}

function buildStats(){
  const total = ALL_MOVIES.length;
  const avg = total ? (ALL_MOVIES.reduce((s,m)=>s+(m.rating||0),0)/total).toFixed(1) : '0.0';
  const now = new Date();
  const thisMonth = ALL_MOVIES.filter(m=>{
    const d = new Date(m.watched);
    return !isNaN(d) && d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).length;

  statsEl.innerHTML = `
    <div class="rune"><span class="num">${total}</span><span class="lbl">Всього</span></div>
    <div class="rune"><span class="num">${thisMonth}</span><span class="lbl">Цього місяця</span></div>
    <div class="rune"><span class="num">${avg}</span><span class="lbl">Сер. оцінка</span></div>
  `;
}

function buildChips(){
  const genres = ['Усі', ...new Set(ALL_MOVIES.flatMap(m => genresOf(m)))];
  chipsEl.innerHTML = genres.map(g =>
    `<button class="chip ${g===activeGenre?'active':''}" data-genre="${escapeHtml(g)}">${escapeHtml(g)}</button>`
  ).join('');

  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeGenre = btn.dataset.genre;
      chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
}

searchInput.addEventListener('input', render);
sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  render();
});

fetch('movies.json')
  .then(res => {
    if(!res.ok) throw new Error('Не вдалося завантажити movies.json');
    return res.json();
  })
  .then(data => {
    const today = new Date(); today.setHours(0,0,0,0);
    ALL_MOVIES = Array.isArray(data)
      ? data.filter(m => new Date(m.watched) <= today).slice().sort((a,b)=> new Date(b.watched) - new Date(a.watched))
      : [];
    buildStats();
    buildChips();
    render();
  })
  .catch(err => {
    grid.innerHTML = `<div class="empty">Не вдалося завантажити список. Перевір, що файл <strong>movies.json</strong> лежить поруч з index.html.<br><br><span style="opacity:.6">${escapeHtml(err.message)}</span></div>`;
  });
</script>

</body>
</html>
