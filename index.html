<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сьогодні дивимось — yarosfactory</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  :root{
    --card-w: clamp(140px, 18vw, 228px);
    --slot-h: calc(var(--card-w) * 1.5);
  }

  /* ---------- Carousel (analytically positioned, transform-driven) ---------- */
  .carousel-shell{ position:relative; display:flex; align-items:center; gap:8px; }

  .arrow{
    flex:0 0 auto; width:34px; height:34px; border:1px solid var(--border);
    background:rgba(27,22,16,0.7); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    transition:border-color .15s, color .15s;
  }
  .arrow:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .arrow:disabled{ opacity:0.3; cursor:default; pointer-events:none; }

  .stage{ flex:1; position:relative; overflow:hidden; touch-action:pan-y; user-select:none; }

  .track{
    position:relative;
    height:calc(var(--slot-h) + 54px);
    padding-top:16px;
  }

  .node{
    position:absolute;
    top:16px; left:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
  }
  .node.empty, .node.today-empty{ cursor:default; }
  .node.empty{ visibility:hidden; pointer-events:none; }

  .poster-slot{
    height:var(--slot-h);
    width:100%;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }

  .poster-card{
    width:100%; aspect-ratio:2/3;
    border:1px solid var(--border);
    background:var(--panel-2) center/cover no-repeat;
    position:relative; overflow:hidden;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .poster-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; user-drag:none; user-select:none; pointer-events:none; }
  .poster-card .mono{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:10px; font-family:'Spectral', serif; font-size:13px; color:var(--text-mute);
    background:radial-gradient(120% 120% at 20% 0%, rgba(176,141,87,0.10), transparent 60%), var(--panel-2);
  }

  .node.watched .poster-card{ border-color:var(--gold); }
  .node.planned .poster-card{ border-color:var(--text-mute); }
  .node.today .poster-card{
    border-color:var(--gold-bright);
    box-shadow:0 0 0 4px rgba(224,187,125,0.14), 0 0 24px rgba(224,187,125,0.35);
  }
  .node.today-empty .poster-card{
    border-style:dashed; border-color:var(--text-mute);
    display:flex; align-items:center; justify-content:center;
  }
  .node.today-empty .poster-card .q{ font-family:'Spectral', serif; font-size:26px; color:var(--text-mute); }
  .node .flame{ position:absolute; bottom:-2px; right:-2px; font-size:12px; z-index:2; }

  .node-title{
    font-size:12.5px; color:var(--text-dim); text-align:center; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .node-date{ font-size:10px; color:var(--text-mute); }

  .node.is-focused .node-title{ color:var(--text); font-weight:600; font-size:17px; }
  .node.is-focused .node-date{ font-size:12px; color:var(--text-dim); }
  .node.is-compact .node-title, .node.is-compact .node-date{ display:none; }

  .today-banner{
    max-width:520px; margin:26px auto 0; text-align:center;
    background:var(--panel); border:1px solid var(--border); padding:20px 24px;
  }
  .today-banner p{ font-size:13.5px; color:var(--text-dim); margin:0 0 4px; }
  .today-banner p strong{ color:var(--gold-bright); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">yarosfactory · ярос</div>
    <h1>Сьогодні дивимось</h1>
    <p class="sub">Гортай стрічку свайпом чи стрілками, тицяй на картку — відкриється сторінка фільму.</p>
    <nav class="pagenav"><a href="archive.html">← Архів переглянутого</a><a href="calendar.html">Календар →</a></nav>
    <div id="authWidget"></div>
  </header>

  <div class="carousel-shell">
    <button class="arrow" id="prevBtn" aria-label="Назад">‹</button>
    <div class="stage" id="stage">
      <div id="widthProbe" style="position:absolute; visibility:hidden; pointer-events:none; width:var(--card-w); height:0;"></div>
      <div class="track" id="track"></div>
    </div>
    <button class="arrow" id="nextBtn" aria-label="Вперед">›</button>
  </div>

  <div id="bannerSection"></div>

  <footer>оновлюється вручну · movies.json</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="common.js"></script>
<script>
let MERGED = [];
let currentIndex = 0;

const stage = document.getElementById('stage');
const track = document.getElementById('track');
const bannerSection = document.getElementById('bannerSection');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderBanner(m){
  if(!m) { bannerSection.innerHTML = ''; return; }

  const status = statusOf(m);
  if(status === 'today-empty'){
    bannerSection.innerHTML = `
      <div class="today-banner">
        <p>На жаль, сьогодні нічого не заплановано.</p>
        <a class="twitch-link" href="https://www.twitch.tv/yarosfactory" target="_blank" rel="noopener">Замовити на стрімі →</a>
      </div>
    `;
  } else if(status === 'today'){
    bannerSection.innerHTML = `
      <div class="today-banner">
        <p>Сьогодні дивимось${m.orderedBy ? `. Замовлення: <strong>${escapeHtml(m.orderedBy)}</strong>` : ''}</p>
        <a class="twitch-link" href="https://www.twitch.tv/yarosfactory" target="_blank" rel="noopener">Перейти на стрім →</a>
      </div>
    `;
  } else {
    bannerSection.innerHTML = '';
  }
}

function nodeHtml(idx, offset){
  if(idx < 0 || idx >= MERGED.length){
    return `<div class="node empty" data-offset="${offset}"></div>`;
  }
  const m = MERGED[idx];
  const status = statusOf(m);
  let inner;
  if(m.__placeholder){
    inner = `<img src="no-order.jpg" alt="" draggable="false" onerror="this.parentElement.innerHTML='<span class=&quot;q&quot;>?</span>'">`;
  } else {
    inner = m.poster
      ? `<img src="${escapeHtml(m.poster)}" alt="" draggable="false" onerror="this.parentElement.innerHTML='<span class=&quot;mono&quot;>${escapeHtml(m.title||'')}</span>'">`
      : `<span class="mono">${escapeHtml(m.title||'')}</span>`;
  }
  const flame = status === 'today' ? '<span class="flame">🔥</span>' : '';
  const hostRating = m.rating ? (Number.isInteger(m.rating) ? m.rating : m.rating.toFixed(1)) : '';
  const ratingBadge = !m.__placeholder
    ? `<div class="badge-rating" ${hostRating ? '' : 'style="display:none"'}><svg viewBox="0 0 20 20"><path d="M10 1l2.6 6h6.4l-5.2 4 2 6.4L10 13.8 4.2 17.4l2-6.4L1 7h6.4z"/></svg><span class="val">${hostRating}</span></div>`
    : '';
  const title = m.__placeholder ? 'Сьогодні' : (m.title || '');
  return `
    <div class="node ${status}" data-index="${idx}" data-offset="${offset}">
      <div class="poster-slot"><div class="poster-card">${inner}${flame}${ratingBadge}</div></div>
      <div class="node-title">${escapeHtml(title)}</div>
      <div class="node-date">${fmtDateShort(m.watched)}</div>
    </div>
  `;
}

const BUFFER = 22;
const GAP_PX = 10;

/* ---- Base card width (resolved px value of --card-w) ---- */
const widthProbe = document.getElementById('widthProbe');
let baseCardW = 200;
function updateBaseWidth(){
  const w = widthProbe.getBoundingClientRect().width;
  if(w > 0) baseCardW = w;
}
function stepPx(){ return baseCardW * 0.62; }

/* ---- dragProgress: single scalar, "how many cards past currentIndex" is in focus right now.
   Everything (position + size + opacity) is a pure function of this value — no DOM
   measurement is needed to drive it, which is what keeps it jitter-free. ---- */
let dragProgress = 0;

function layout(){
  const nodes = track.children;
  const n = nodes.length;
  if(n === 0) return;

  const widths = new Array(n);
  for(let i = 0; i < n; i++){
    const k = parseFloat(nodes[i].dataset.offset);
    const eff = k - dragProgress;
    const s = Math.max(1 / (1 + 0.55 * Math.abs(eff)), 0.16);
    widths[i] = Math.max(baseCardW * s, 30);
  }

  const centers = new Array(n);
  let x = 0;
  for(let i = 0; i < n; i++){
    centers[i] = x + widths[i] / 2;
    x += widths[i] + GAP_PX;
  }

  const floorK = Math.floor(dragProgress);
  const ceilK = Math.ceil(dragProgress);
  const frac = dragProgress - floorK;
  const floorIdx = floorK + BUFFER;
  const ceilIdx = ceilK + BUFFER;
  let focusCenter;
  if(floorIdx >= 0 && floorIdx < n && ceilIdx >= 0 && ceilIdx < n){
    focusCenter = centers[floorIdx] * (1 - frac) + centers[ceilIdx] * frac;
  } else {
    const clampedIdx = Math.max(0, Math.min(n - 1, Math.round(dragProgress) + BUFFER));
    focusCenter = centers[clampedIdx];
  }

  const shift = stage.clientWidth / 2 - focusCenter;

  for(let i = 0; i < n; i++){
    const node = nodes[i];
    const w = widths[i];
    const leftEdge = centers[i] - w / 2 + shift;
    node.style.width = w.toFixed(1) + 'px';
    node.style.transform = `translateX(${leftEdge.toFixed(1)}px)`;
    const k = parseFloat(node.dataset.offset);
    const eff = Math.abs(k - dragProgress);
    node.style.opacity = Math.max(1 - eff * 0.4, 0.15).toFixed(2);
    node.classList.toggle('is-focused', eff < 0.25);
    node.classList.toggle('is-compact', eff > 1.4);
  }
}

function renderWindow(){
  const offsets = [];
  for(let i = -BUFFER; i <= BUFFER; i++) offsets.push(i);
  track.innerHTML = offsets.map(off => nodeHtml(currentIndex + off, off)).join('');

  track.querySelectorAll('.node[data-index]').forEach(node => {
    const idx = parseInt(node.dataset.index, 10);
    const m = MERGED[idx];
    if(m.__placeholder) return;
    node.dataset.href = 'movie.html?id=' + encodeURIComponent(movieId(m));
  });

  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= MERGED.length - 1;

  attachViewerRatings();
  dragProgress = 0;
  layout();
}

let ratingUnsubs = [];
function attachViewerRatings(){
  ratingUnsubs.forEach(unsub => unsub());
  ratingUnsubs = [];
  if(!firebaseReady) return;

  track.querySelectorAll('.node[data-index] .badge-rating').forEach(badge => {
    const node = badge.closest('.node');
    const idx = parseInt(node.dataset.index, 10);
    const m = MERGED[idx];
    if(!m || m.__placeholder) return;
    const id = movieId(m);
    const valEl = badge.querySelector('.val');
    const unsub = db.collection('reactions').doc(id).onSnapshot(snap => {
      const data = snap.exists ? snap.data() : {};
      const count = data.ratingCount || 0;
      if(count > 0){
        valEl.textContent = (data.ratingSum / count).toFixed(1);
        badge.style.display = '';
      }
    }, err => console.warn('Помилка Firestore (rating badge):', err.message));
    ratingUnsubs.push(unsub);
  });
}

function setCurrentInstant(i){
  if(i < 0 || i >= MERGED.length) return;
  currentIndex = i;
  renderWindow();
  renderBanner(MERGED[currentIndex]);
}

/* ---- Tweening: animate dragProgress smoothly toward an integer target, then swap content ---- */
let tweenRAF = null;
function cancelTween(){
  if(tweenRAF){ cancelAnimationFrame(tweenRAF); tweenRAF = null; }
}

function animateProgressTo(target, duration, onDone){
  cancelTween();
  const startVal = dragProgress;
  const startTime = performance.now();
  function step(now){
    const elapsed = (now - startTime) / 1000;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    dragProgress = startVal + (target - startVal) * eased;
    layout();
    if(t < 1){
      tweenRAF = requestAnimationFrame(step);
    } else {
      tweenRAF = null;
      if(onDone) onDone();
    }
  }
  tweenRAF = requestAnimationFrame(step);
}

function commitToOffset(k){
  const minK = -currentIndex;
  const maxK = MERGED.length - 1 - currentIndex;
  k = Math.max(minK, Math.min(maxK, Math.round(k)));
  const duration = Math.min(0.5, 0.22 + Math.abs(k - dragProgress) * 0.05);
  animateProgressTo(k, duration, () => {
    setCurrentInstant(currentIndex + k);
  });
}

prevBtn.addEventListener('click', () => { if(!tweenRAF && currentIndex > 0) commitToOffset(-1); });
nextBtn.addEventListener('click', () => { if(!tweenRAF && currentIndex < MERGED.length - 1) commitToOffset(1); });

document.addEventListener('keydown', (e) => {
  if(tweenRAF) return;
  if(e.key === 'ArrowLeft' && currentIndex > 0) commitToOffset(-1);
  if(e.key === 'ArrowRight' && currentIndex < MERGED.length - 1) commitToOffset(1);
});

/* swipe / drag support — dragProgress follows the pointer live, like spinning a physical wheel */
let dragStartX = null;
let dragStartProgress = 0;
let dragMoved = false;
let velocitySamples = [];
let pointerDownNode = null;

stage.addEventListener('pointerdown', (e) => {
  cancelTween();
  dragStartX = e.clientX;
  dragStartProgress = dragProgress;
  dragMoved = false;
  pointerDownNode = e.target.closest('.node[data-href]');
  velocitySamples = [{ t: performance.now(), x: e.clientX }];
  if(stage.setPointerCapture){
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  }
});
stage.addEventListener('pointermove', (e) => {
  if(dragStartX === null) return;
  const deltaPx = e.clientX - dragStartX;
  if(Math.abs(deltaPx) > 10) dragMoved = true;
  dragProgress = dragStartProgress - deltaPx / stepPx();
  layout();

  const now = performance.now();
  velocitySamples.push({ t: now, x: e.clientX });
  while(velocitySamples.length > 2 && now - velocitySamples[0].t > 80){
    velocitySamples.shift();
  }
});

function finishDrag(){
  if(dragStartX === null) return;
  dragStartX = null;

  if(!dragMoved && pointerDownNode){
    window.location.href = pointerDownNode.dataset.href;
    return;
  }

  let velocityPx = 0;
  if(velocitySamples.length >= 2){
    const first = velocitySamples[0];
    const last = velocitySamples[velocitySamples.length - 1];
    const dt = last.t - first.t;
    if(dt > 0) velocityPx = (last.x - first.x) / dt;
  }
  const velocityProgress = -velocityPx / stepPx();
  const projected = dragProgress + velocityProgress * 220;

  commitToOffset(Math.round(projected));
  setTimeout(() => { dragMoved = false; }, 0);
}

stage.addEventListener('pointerup', finishDrag);
stage.addEventListener('pointercancel', () => {
  if(dragStartX === null) return;
  dragStartX = null;
  commitToOffset(Math.round(dragProgress));
});
/* safety net: if the button is released outside the window (or the tab loses focus)
   pointerup can be missed entirely — make sure the drag always gets released */
window.addEventListener('blur', () => { if(dragStartX !== null) finishDrag(); });
document.addEventListener('pointerup', () => { if(dragStartX !== null) finishDrag(); });
document.addEventListener('pointerleave', () => { if(dragStartX !== null) finishDrag(); });

window.addEventListener('resize', () => {
  updateBaseWidth();
  layout();
});

initAuth(document.getElementById('authWidget'));

fetch('movies.json')
  .then(res => {
    if(!res.ok) throw new Error('Не вдалося завантажити movies.json');
    return res.json();
  })
  .then(data => {
    const list = Array.isArray(data) ? data.slice() : [];
    const t = todayStr();
    const hasToday = list.some(m => m.watched === t);
    if(!hasToday){
      list.push({ __placeholder: true, watched: t });
    }
    MERGED = list.sort((a, b) => new Date(a.watched) - new Date(b.watched));

    if(MERGED.length === 0){
      bannerSection.innerHTML = `<div class="empty-state">Ще немає жодного фільму. Додай записи в movies.json.</div>`;
      return;
    }

    let startIndex = MERGED.findIndex(m => m.__placeholder || m.watched === t);
    if(startIndex === -1) startIndex = 0;
    currentIndex = startIndex;

    updateBaseWidth();
    renderWindow();
    renderBanner(MERGED[currentIndex]);
  })
  .catch(err => {
    bannerSection.innerHTML = `<div class="empty-state">Не вдалося завантажити список. Перевір, що файл <strong>movies.json</strong> лежить поруч з index.html.<br><br><span style="opacity:.6">${escapeHtml(err.message)}</span></div>`;
  });
</script>

</body>
</html>
